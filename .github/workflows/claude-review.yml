# Copy to .github/workflows/claude-review.yml in the claude-code-action tool repo (rtr-08).
# Auth: repo secret CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (Pro/Max subscription),
# or ANTHROPIC_API_KEY. Verify input names against anthropics/claude-code-action action.yml at setup.
name: claude-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # alternative
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*)"'
